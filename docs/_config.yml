title: SurfsUp 🌊SDK
logo: /assets/img/sdk_logo.png
description: Map making documentation for SurfsUp
show_downloads: true
remote_theme: just-the-docs/just-the-docs

# Custom color scheme matching SurfsUp website
color_scheme: surfsup

# Search
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# Navigation
nav_sort: case_insensitive
nav_enabled: true

# Footer content
footer_content: "Copyright &copy; 2025 SurfsUp. Built with <a href=\"https://github.com/just-the-docs/just-the-docs\">Just the Docs</a>."

# Back to top link
back_to_top: true
back_to_top_text: "Back to top"

# Aux links
aux_links:
  "SurfsUp on GitHub":
    - "//github.com/bearlikelion/SurfsUpSDK"
  "Visit SurfsUp":
    - "//surfsup.website"

# Heading anchor links
heading_anchors: true

# External navigation links
nav_external_links:
  - title: SurfsUp Website
    url: https://surfsup.website
    hide_icon: false

plugins:
- jekyll-remote-theme
